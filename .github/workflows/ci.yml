name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install
        run: |
          uv venv --python 3.13 .venv
          uv pip install -e ".[dev]"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: ruff check
        run: bash .github/scripts/annotate.sh "ruff check" ruff check --output-format=github .
      - name: ruff format
        run: bash .github/scripts/annotate.sh "ruff format" ruff format --check .
      - name: shellcheck
        run: |
          bash .github/scripts/annotate.sh "shellcheck install.sh" shellcheck -s sh install.sh
          bash .github/scripts/annotate.sh "shellcheck annotate.sh" shellcheck .github/scripts/annotate.sh
      - name: Parse install.ps1 (PowerShell 7 parser)
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          foreach ($e in $errors) { Write-Output "::error file=install.ps1,line=$($e.Extent.StartLineNumber),title=install.ps1 parse error::$($e.Message)" }
          if ($errors) { exit 1 }

  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build wheel and sdist
        run: bash .github/scripts/annotate.sh "uv build" uv build --out-dir dist
      - name: The wheel carries the UI templates, htmx and its license
        run: |
          python3 - <<'PY'
          import glob, zipfile
          names = set(zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist())
          need = ["creative_forge/ui/static/htmx.min.js", "creative_forge/ui/static/htmx.LICENSE.txt",
                  "creative_forge/ui/templates/run.html", "creative_forge/qa/ocr_vision.swift",
                  "creative_forge/data/pricing.yaml", "creative_forge/data/model_licenses.yaml",
                  "creative_forge/data/tag_taxonomy.yaml", "creative_forge/ui/templates/perf.html",
                  "creative_forge/playable/stubs.js", "creative_forge/ui/static/theme.js",
                  "creative_forge/data/desktop/creative-forge.ico",
                  "creative_forge/data/desktop/creative-forge.icns", "creative_forge/data/desktop/creative-forge.png"]
          missing = [n for n in need if n not in names]
          if missing:
              print(f"::error title=wheel contents::missing {missing}")
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  tests:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CREATIVE_FORGE_REQUIRE_OCR: rapidocr # the RapidOCR tests fail instead of skipping if the backend is missing
      CREATIVE_FORGE_REQUIRE_EXTRAS: "1" # so do the tests of the optional extras (segments, playable)
      CREATIVE_FORGE_HOME: ${{ github.workspace }}/.forge-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Nine jobs need the same pinned build; download it once per OS and pin, not nine times from its publishers.
      # The user-install jobs below always download it fresh, the way a user does.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .forge-home/data/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('creative_forge/setup_ffmpeg.py') }}
      - name: Install (Python ${{ matrix.python }}, editable, with the ocr, segments and playable extras)
        run: |
          uv venv --python "${{ matrix.python }}" .venv
          uv pip install -e ".[dev,ocr,segments,playable]"
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$GITHUB_WORKSPACE\\.venv\\Scripts" >> "$GITHUB_PATH"
          else
            echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          fi
      - name: Chromium for the playable browser tests (Playwright's own build)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then deps="--with-deps"; else deps=""; fi
          bash .github/scripts/annotate.sh "playwright install" python -m playwright install $deps chromium
      - name: forge setup ffmpeg (the pinned, SHA-256 verified download a user gets)
        run: bash .github/scripts/annotate.sh "forge setup ffmpeg" forge setup ffmpeg
      - name: forge doctor
        run: bash .github/scripts/annotate.sh "forge doctor" forge doctor
      - name: Tests (a locale-dependent encoding anywhere in our code is an error, on every OS)
        run: >-
          bash .github/scripts/annotate.sh "pytest ${{ matrix.os }} py${{ matrix.python }}"
          python -X warn_default_encoding -W error::EncodingWarning -m pytest -q -p no:cacheprovider

  # A user's install, end to end: the README's one-liner, read from README.md and run as written except that "main"
  # becomes this commit, so the branch is tested before it is merged. Without a release the installer would fall back
  # to the main branch's source archive; FORGE_SOURCE points it at this commit's archive instead, or, in the
  # "release 404" jobs, FORGE_RELEASE_URL is a wheel that does not exist and FORGE_ARCHIVE_URL is this commit's
  # archive, so the 404 -> archive path runs for real. One job installs the wheel the build job made.
  user-install:
    permissions:
      contents: read
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, via: "curl | sh", source: archive }
          - { os: macos-latest, via: "curl | sh", source: archive }
          - { os: windows-latest, via: "Windows PowerShell 5.1", source: archive }
          - { os: windows-latest, via: "PowerShell 7", source: archive }
          - { os: ubuntu-latest, via: "curl | sh", source: "release 404, archive fallback" }
          - { os: windows-latest, via: "Windows PowerShell 5.1", source: "release 404, archive fallback" }
          - { os: ubuntu-latest, via: "curl | sh", source: "built wheel" }
    name: user-install (${{ matrix.os }}, ${{ matrix.via }}, ${{ matrix.source }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      SCRIPT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_MODE: ${{ matrix.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Point the installer at this commit (${{ matrix.source }})
        shell: bash
        run: |
          archive="https://github.com/${GITHUB_REPOSITORY}/archive/${SCRIPT_REF}.zip"
          case "$SOURCE_MODE" in
            archive) echo "FORGE_SOURCE=$archive" >> "$GITHUB_ENV" ;;
            "built wheel") echo "FORGE_SOURCE=$(ls "$PWD"/dist/*.whl)" >> "$GITHUB_ENV" ;;
            *)
              echo "FORGE_RELEASE_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/v0.0.0-ci-missing/creative_forge-0.0.0-py3-none-any.whl" >> "$GITHUB_ENV"
              echo "FORGE_ARCHIVE_URL=$archive" >> "$GITHUB_ENV"
              ;;
          esac
      - name: README one-liner (curl | sh)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          line=$(grep -m1 -E '^curl -LsSf https://raw\.githubusercontent\.com/[^ ]+/main/install\.sh \| sh$' README.md) || {
            echo "::error title=README::no 'curl ... /main/install.sh | sh' one-liner found in README.md"; exit 1; }
          cmd=${line/\/main\/install.sh/\/$SCRIPT_REF\/install.sh}
          echo "README: $line"
          echo "run:    $cmd"
          bash .github/scripts/annotate.sh "README one-liner (sh)" bash -c "set -o pipefail; $cmd" | tee "$RUNNER_TEMP/install.log"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: README one-liner (Windows PowerShell 5.1)
        if: matrix.via == 'Windows PowerShell 5.1'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          . .github\scripts\Invoke-Step.ps1
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          foreach ($e in $errors) { Write-Output "::error file=install.ps1,line=$($e.Extent.StartLineNumber),title=install.ps1 (5.1 parser)::$($e.Message)" }
          if ($errors) { exit 1 }
          $pattern = '^powershell -ExecutionPolicy Bypass -c "irm https://raw\.githubusercontent\.com/\S+/main/install\.ps1 \| iex"$'
          $line = (Select-String -LiteralPath README.md -Pattern $pattern -CaseSensitive | Select-Object -First 1).Line
          if (-not $line) { Write-Output "::error title=README::no 'powershell ... irm .../main/install.ps1 | iex' one-liner in README.md"; exit 1 }
          $cmd = $line.Replace('/main/install.ps1', "/$env:SCRIPT_REF/install.ps1")
          Write-Output "README: $line"
          Write-Output "run:    $cmd"
          Invoke-Step 'README one-liner (Windows PowerShell 5.1)' { Invoke-Expression $cmd }
          Copy-Item -LiteralPath $global:LastStepLog -Destination "$env:RUNNER_TEMP\install.log"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.local\bin" -Encoding Ascii
      - name: README one-liner (PowerShell 7, pwsh in place of powershell)
        if: matrix.via == 'PowerShell 7'
        shell: pwsh
        run: |
          . ./.github/scripts/Invoke-Step.ps1
          $pattern = '^powershell -ExecutionPolicy Bypass -c "irm https://raw\.githubusercontent\.com/\S+/main/install\.ps1 \| iex"$'
          $line = (Select-String -LiteralPath README.md -Pattern $pattern -CaseSensitive | Select-Object -First 1).Line
          if (-not $line) { Write-Output "::error title=README::no 'powershell ... irm .../main/install.ps1 | iex' one-liner in README.md"; exit 1 }
          $cmd = 'pwsh' + $line.Substring('powershell'.Length).Replace('/main/install.ps1', "/$env:SCRIPT_REF/install.ps1")
          Write-Output "README: $line"
          Write-Output "run:    $cmd"
          Invoke-Step 'README one-liner (PowerShell 7)' { Invoke-Expression $cmd }
          Copy-Item -LiteralPath $global:LastStepLog -Destination "$env:RUNNER_TEMP/install.log"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.local\bin"
      - name: The installer said which source it used
        shell: pwsh
        run: |
          $log = Get-Content -Raw -LiteralPath (Join-Path $env:RUNNER_TEMP 'install.log')
          if ($env:SOURCE_MODE -eq 'release 404, archive fallback') {
            $archive = 'source: main branch source archive \(https://github\.com/\S+/archive/' + $env:SCRIPT_REF + '\.zip\)'
            if ($log -notmatch 'no release wheel for v\S+ \(HTTP 404' -or $log -notmatch $archive) {
              Write-Output "::error title=archive fallback::the installer did not report the 404 and the archive fallback"; exit 1
            }
            Write-Output "::notice title=archive fallback ${{ matrix.os }}::release wheel 404, installed from archive/$env:SCRIPT_REF.zip"
          } elseif ($log -notmatch 'source: FORGE_SOURCE=') {
            Write-Output "::error title=installer source::no 'source: FORGE_SOURCE=' line in the install log"; exit 1
          }
      - name: The installed forge uses the ffmpeg it downloaded, and RapidOCR or Vision
        shell: pwsh
        run: |
          . ./.github/scripts/Invoke-Step.ps1
          Invoke-Step 'forge --version' { forge --version }
          Invoke-Step 'forge doctor --json' { forge doctor --json > "$env:RUNNER_TEMP/doctor.json" }
          $d = Get-Content -Raw "$env:RUNNER_TEMP/doctor.json" | ConvertFrom-Json
          $ff = $d.items | Where-Object name -eq 'ffmpeg'
          $ocr = $d.items | Where-Object name -eq 'ocr'
          Write-Output "ffmpeg: $($ff.summary)"
          Write-Output "ocr: $($ocr.summary)"
          # public evidence (annotations are readable without signing in): what this runner actually uses
          $py = $d.items | Where-Object name -eq 'python'
          Write-Output "::notice title=doctor ${{ matrix.os }} job ${{ strategy.job-index }}::$($py.details.platform) | ffmpeg $($ff.details.source): $($ff.details.version) | AAC encoders that open: $($ff.details.aac_encoders -join ' ') | $($ocr.summary)"
          if ($ff.details.source -ne 'managed') { Write-Output "::error title=ffmpeg source::expected the managed build, got $($ff.details.source)"; exit 1 }
          if ($ocr.status -ne 'ok') { Write-Output "::error title=ocr::$($ocr.summary)"; exit 1 }
      # The installer added the launcher people double-click; run exactly what it points at (the
      # windowless creative-forge program) with --check: it serves the review UI with the
      # heartbeat, loads the pages and stops (no window on a runner).
      - name: Desktop launcher (Start menu / Desktop, ~/Applications, app menu) and its launch
        shell: pwsh
        run: |
          function Fail([string]$msg) { "::error title=desktop launcher (${{ matrix.os }} job ${{ strategy.job-index }})::$msg"; exit 1 }
          $env:CREATIVE_FORGE_HOME = Join-Path $env:RUNNER_TEMP ('forge app ' + [char]0x00E7 + [char]0x0131)
          if ($IsWindows) {
            $shell = New-Object -ComObject WScript.Shell
            $target = $null
            foreach ($folder in 'Desktop', 'Programs') {
              $lnk = Join-Path ([Environment]::GetFolderPath($folder)) 'Creative Forge.lnk'
              if (-not (Test-Path -LiteralPath $lnk)) { Fail "missing $lnk" }
              $target = $shell.CreateShortcut($lnk).TargetPath
              if (-not $target.EndsWith('creative-forge.exe') -or -not (Test-Path -LiteralPath $target)) { Fail "$lnk points at '$target'" }
            }
            $p = Start-Process -FilePath $target -ArgumentList '--check' -Wait -PassThru
            $code = $p.ExitCode
          } elseif ($IsMacOS) {
            $app = Join-Path $HOME 'Applications/Creative Forge.app'
            $target = Join-Path $app 'Contents/MacOS/creative-forge'
            if (-not (Test-Path -LiteralPath $target)) { Fail "missing $target" }
            & plutil -lint (Join-Path $app 'Contents/Info.plist'); if ($LASTEXITCODE) { Fail 'Info.plist is not valid' }
            & $target --check; $code = $LASTEXITCODE
          } else {
            $entry = Join-Path $HOME '.local/share/applications/creative-forge.desktop'
            if (-not (Test-Path -LiteralPath $entry)) { Fail "missing $entry" }
            $exec = (Select-String -LiteralPath $entry -Pattern '^Exec="(.+)"$').Matches[0].Groups[1].Value
            & $exec --check; $code = $LASTEXITCODE
          }
          $log = Join-Path $env:CREATIVE_FORGE_HOME 'data/app/logs/app.log'
          if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 20 }
          if ($code -ne 0) { Fail "the launcher's --check exited $code" }
          "::notice title=desktop launcher (${{ matrix.os }} job ${{ strategy.job-index }})::launcher present; it served the review UI with the heartbeat and stopped"
      - name: forge demo, review, publish and ui in a directory with Turkish characters
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()
          . ./.github/scripts/Invoke-Step.ps1
          # "Çalışma Ş/İğ", built from code points so the workflow file's own encoding cannot mangle it
          $top = -join [char[]](0x00C7, 0x61, 0x6C, 0x0131, 0x015F, 0x6D, 0x61, 0x20, 0x015E)
          $sub = -join [char[]](0x0130, 0x011F)
          $work = Join-Path (Join-Path $env:RUNNER_TEMP $top) $sub
          New-Item -ItemType Directory -Force $work | Out-Null
          Set-Location -LiteralPath $work
          Write-Output "working in $work"
          Invoke-Step 'forge doctor (Turkish dir)' { forge doctor }
          Invoke-Step 'forge demo (Turkish dir)' { forge demo --out out }
          $files = @((Get-Content -Raw out/report.json | ConvertFrom-Json).concepts.exports.file)
          $note = 'CI: T' + [char]0x00FC + 'rk' + [char]0x00E7 + 'e not'
          Invoke-Step 'forge review' { forge review out --approve @files --note $note --reviewer ci }
          Invoke-Step 'forge publish' { forge publish out --to deliver }
          $art = Join-Path $env:RUNNER_TEMP 'forge-artifacts'
          New-Item -ItemType Directory -Force $art | Out-Null
          Copy-Item out/report.html, out/report.json, out/review.json, deliver/manifest.json, "$env:RUNNER_TEMP/doctor.json" -Destination $art
          Copy-Item out/*.mp4 -Destination $art
          # Start-Process joins -ArgumentList with spaces and no quoting, so the folder is passed as "." (the
          # working directory), never as a path with a space in it.
          $ui = Start-Process -FilePath (Get-Command forge).Source -WorkingDirectory $work -PassThru -NoNewWindow `
            -ArgumentList 'ui', '--no-browser', '--port', '8765', '--root', '.'
          try {
            $page = $null
            foreach ($i in 1..60) {
              try { $page = Invoke-WebRequest -Uri 'http://127.0.0.1:8765/' -UseBasicParsing; break } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $page) { Write-Output "::error title=forge ui::no answer on 127.0.0.1:8765 within 30 s (exited: $($ui.HasExited), code $($ui.ExitCode))"; exit 1 }
            if ($page.Content -notmatch '/runs/out') { Write-Output "::error title=forge ui::the runs page did not list the demo run"; exit 1 }
            $run = Invoke-WebRequest -Uri 'http://127.0.0.1:8765/runs/out' -UseBasicParsing
            $range = Invoke-WebRequest -Uri "http://127.0.0.1:8765/runs/out/media/$($files[0])" -Headers @{ Range = 'bytes=0-99' } -UseBasicParsing
            if ($run.StatusCode -ne 200 -or $range.StatusCode -ne 206) { Write-Output "::error title=forge ui::run page $($run.StatusCode), range request $($range.StatusCode)"; exit 1 }
            Write-Output "forge ui: runs page, run page and a 206 range request OK"
          } finally {
            Stop-Process -Id $ui.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: forge-demo-${{ matrix.os }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/forge-artifacts/
          if-no-files-found: warn
          retention-days: 7
