name: release

# Pushing a tag vX.Y.Z builds the wheel and sdist and attaches them, with install.sh, install.ps1 and SHA256SUMS.txt,
# to the GitHub Release for that tag (created if it does not exist). The installers' one-liners download
# releases/latest/download/install.{sh,ps1}, which then install the wheel of their own version.

on:
  push:
    tags: ["v*"]

permissions: {} # the job asks for what it needs

jobs:
  release:
    permissions:
      contents: write # create the release and attach its files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: The tag matches the package and installer versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n 1)
          sh_v=$(sed -n 's/^FORGE_VERSION="\(.*\)"/\1/p' install.sh | head -n 1)
          ps_v=$(sed -n "s/^ *\$ForgeVersion = '\(.*\)'/\1/p" install.ps1 | head -n 1)
          echo "tag $tag, pyproject $py, install.sh $sh_v, install.ps1 $ps_v"
          if [ "$tag" != "$py" ] || [ "$tag" != "$sh_v" ] || [ "$tag" != "$ps_v" ]; then
            echo "::error title=version mismatch::tag $tag, pyproject $py, install.sh $sh_v, install.ps1 $ps_v"
            exit 1
          fi
      - name: Build
        run: bash .github/scripts/annotate.sh "uv build" uv build --out-dir dist
      - name: Smoke test the wheel
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/v"
          uv pip install --python "$RUNNER_TEMP/v/bin/python" "$(ls dist/*.whl)"
          bash .github/scripts/annotate.sh "forge --version" "$RUNNER_TEMP/v/bin/forge" --version
      - name: Checksums
        run: |
          cp install.sh install.ps1 dist/
          (cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "creative-forge $GITHUB_REF_NAME" --generate-notes
          fi
