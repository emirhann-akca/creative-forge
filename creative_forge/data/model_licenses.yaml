  - id: sdxl-base-1.0
    kind: image_edit
    match: ["sd_xl_base_1.0*", "stable-diffusion-xl-base-1.0*", "stabilityai/stable-diffusion-xl-base-1.0", "sd_xl_*inpaint*", "stable-diffusion-xl-1.0-inpainting*"]
    code_license: MIT
    weights_license: openrail++ (CreativeML Open RAIL++-M)
    commercial: "yes"
    note: Commercial use is allowed; the licence's use-based restrictions apply and must be passed on.
    source: https://huggingface.co/stabilityai/stable-diffusion-xl-base-1.0
    checked: "2026-11-11"

  # ------------------------------------------------------------------------------- background removal (rembg models)
  - id: rmbg-2.0
    kind: background_removal
    match: ["bria-rmbg*", "rmbg-2.0*", "rmbg_2.0*", "briaai/rmbg-2.0"]
    code_license: MIT (rembg)
    weights_license: bria-rmbg-2.0
    commercial: "no"
    note: rembg's DEFAULT model; "requires a paid agreement for commercial use". Pin birefnet-general instead.
    source: https://huggingface.co/briaai/RMBG-2.0
    checked: "2026-11-11"
  - id: rmbg-1.4
    kind: background_removal
    match: ["rmbg-1.4*", "rmbg_1.4*", "briaai/rmbg-1.4"]
    code_license: MIT (rembg)
    weights_license: bria-rmbg-1.4
    commercial: "no"
    note: A paid agreement is needed for commercial use.
    source: https://huggingface.co/briaai/RMBG-1.4
    checked: "2026-11-11"
  - id: birefnet
    kind: background_removal
    match: ["birefnet*", "zhengpeng7/birefnet*"]
    code_license: MIT
    weights_license: mit
    commercial: "yes"
    note: The rembg model to pin (`-m birefnet-general`).
    source: https://huggingface.co/ZhengPeng7/BiRefNet
    checked: "2026-11-11"

  # ---------------------------------------------------------------------------------------------- music and speech
  - id: musicgen
    kind: music
    match: ["musicgen*", "facebook/musicgen*"]
