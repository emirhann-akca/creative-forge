    checked: "2026-11-11"
  - id: flux2-dev
    kind: image_edit
    match: ["flux2-dev*", "flux2_dev*", "flux.2-dev*", "black-forest-labs/flux.2-dev"]
    code_license: Apache-2.0
    weights_license: FLUX [dev] Non-Commercial License v2.0
    commercial: "no"
