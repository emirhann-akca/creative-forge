    source: https://huggingface.co/facebook/musicgen-small
    checked: "2026-11-11"
  - id: ace-step
    kind: music
    match: ["ace-step*", "ace_step*", "ace-step/*"]
    code_license: Apache-2.0
    weights_license: apache-2.0 (v1-3.5B), mit (1.5)
    commercial: "yes"
    source: https://github.com/ace-step/ACE-Step
    checked: "2026-11-11"
  - id: xtts-v2
    kind: tts
    match: ["xtts*", "coqui/xtts*"]
    code_license: MPL-2.0 (coqui TTS)
    weights_license: coqui-public-model-license
    commercial: "no"
    note: The Coqui Public Model License does not allow commercial use.
    source: https://huggingface.co/coqui/XTTS-v2
    checked: "2026-11-11"
  - id: f5-tts
    kind: tts
    match: ["f5-tts*", "f5tts*", "f5_tts*", "swivid/f5-tts"]
    code_license: MIT
    weights_license: cc-by-nc-4.0
    commercial: "no"
    note: The code is MIT; the released weights are non-commercial.
    source: https://huggingface.co/SWivid/F5-TTS
    checked: "2026-11-11"
  - id: piper-tr_TR-dfki
    kind: tts
    match: ["tr_tr-dfki*", "tr_tr_dfki*", "piper*tr_tr*dfki*"]
    code_license: GPL-3.0 (piper1-gpl)
    weights_license: dataset CC BY-NC-SA 4.0
    commercial: "no"
    note: The voice's dataset is CC BY-NC-SA 4.0, although the Hugging Face repo is tagged "mit".
    source: https://huggingface.co/rhasspy/piper-voices/blob/main/tr/tr_TR/dfki/medium/MODEL_CARD
    checked: "2026-11-11"
  - id: kokoro-82m
    kind: tts
    match: ["kokoro*", "hexgrad/kokoro*"]
    code_license: Apache-2.0
    weights_license: apache-2.0
    commercial: "yes"
    note: No Turkish voice.
    source: https://huggingface.co/hexgrad/Kokoro-82M
    checked: "2026-11-11"
  - id: chatterbox
    kind: tts
    match: ["chatterbox*", "resembleai/chatterbox*"]
    code_license: MIT
    weights_license: mit
    commercial: "yes"
    note: A Perth watermark is embedded in every output, and the project is "retired research" since August 2026.
    source: https://github.com/resemble-ai/chatterbox
    checked: "2026-11-11"

  # ------------------------------------------------------------------------------------------------- analysis (QA)
  - id: rapidocr-pp-ocr
    kind: ocr
    match: ["rapidocr*", "pp-ocr*"]
    code_license: Apache-2.0
    weights_license: Apache-2.0 (PaddleOCR models)
    commercial: "yes"
    source: https://github.com/RapidAI/RapidOCR
    checked: "2026-11-11"
  - id: faster-whisper
    kind: asr
    match: ["faster-whisper*", "systran/faster-whisper*", "whisper-large-v3*"]
    code_license: MIT
    weights_license: mit
    commercial: "yes"
    source: https://github.com/SYSTRAN/faster-whisper
    checked: "2026-11-11"
