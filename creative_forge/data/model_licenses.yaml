# Licence registry: every model creative-forge can call, and what its licence says about paid ad production.
#
# "Commercial ad use" here means producing paid user-acquisition videos or playables for a commercial game, by a
# for-profit studio far below $10M annual revenue.
#
# commercial:
#   yes          open weights whose licence allows that use (Apache-2.0, MIT, OpenRAIL++-M)
#   no           non-commercial weights: `forge plan` and `forge run` refuse the spec
#   conditional  allowed under a condition (revenue cap, territory, registration); see `conditions`
#   service      a hosted API with no weights: use is governed by the provider's service terms that the account
#                holder accepted, not by a weights licence. Not reviewed here.
#
# conditions (evaluated against the spec's `targets:` section):
#   revenue_cap   {max_annual_revenue_usd}: warn below the cap or when revenue is not declared, refuse at or above
#   territory     {excluded: [EU, UK, KR]}: refuse when targets.regions is empty (= may serve anywhere) or includes an
#                 excluded territory; warn otherwise
#   registration  {text}: warn
#
# match: lowercase globs tested against the model id or file name as written in the spec (Vertex model id, ComfyUI
# checkpoint or diffusion-model file name). The first entry that matches wins, so specific entries come first.
#
# Sources: the 2026-11-11 research report (sections 3.1-3.3), which read each Hugging Face model card's licence
# field and, where the card said "other", the licence text. `checked` is the date the source was read.
as_of: "2026-11-11"
models:
  # ---------------------------------------------------------------------------------------- hosted APIs (Vertex AI)
  - id: veo-3.1
    kind: video
    match: ["veo-*"]
    code_license: null
    weights_license: null
    commercial: service
    note: Hosted Vertex AI model; the Google Cloud terms the project accepted apply. No weights licence.
    source: https://cloud.google.com/terms/service-terms
    checked: null
  - id: gemini-image
    kind: image_edit
    match: ["gemini-*-image*"]
    code_license: null
    weights_license: null
    commercial: service
    note: Hosted Vertex AI model; the Google Cloud terms the project accepted apply. No weights licence.
    source: https://cloud.google.com/terms/service-terms
    checked: null
  - id: lyria
    kind: music
    match: ["lyria-*"]
    code_license: null
    weights_license: null
    commercial: service
    note: Hosted Vertex AI model; the Google Cloud terms the project accepted apply. No weights licence.
    source: https://cloud.google.com/terms/service-terms
    checked: null
  - id: gemini
    kind: judge
    match: ["gemini-*", "text-embedding-*"]
    code_license: null
    weights_license: null
    commercial: service
    note: Hosted Vertex AI model (judge, ideation, embeddings); does not produce ad media.
    source: https://cloud.google.com/terms/service-terms
    checked: null

  # ----------------------------------------------------------------------------------------------- video, open weights
  - id: wan2.1-flf2v-14b-720p
    kind: video
    match: ["wan2.1_flf2v_*", "wan2.1-flf2v-*", "wan-ai/wan2.1-flf2v-*"]
    code_license: Apache-2.0
    weights_license: apache-2.0
    commercial: "yes"
    note: First-last-frame model; the README recommends Chinese prompts (trained mainly on Chinese text). 720P only.
    source: https://huggingface.co/Wan-AI/Wan2.1-FLF2V-14B-720P
    checked: "2026-11-11"
  - id: wan2.1-i2v-14b
    kind: video
    match: ["wan2.1_i2v_*", "wan2.1-i2v-*", "wan-ai/wan2.1-i2v-*"]
    code_license: Apache-2.0
    weights_license: apache-2.0
    commercial: "yes"
    source: https://huggingface.co/Wan-AI/Wan2.1-I2V-14B-480P
    checked: "2026-11-11"
  - id: wan2.2-ti2v-5b
    kind: video
    match: ["wan2.2_ti2v_5b*", "wan2.2-ti2v-5b*", "wan-ai/wan2.2-ti2v-5b"]
    code_license: Apache-2.0
    weights_license: apache-2.0
    commercial: "yes"
    note: ComfyUI's docs say it "should fit well on 8GB vram with the ComfyUI native offloading".
    source: https://huggingface.co/Wan-AI/Wan2.2-TI2V-5B
    checked: "2026-11-11"
  - id: wan2.2-a14b
    kind: video
    match: ["wan2.2_i2v_*", "wan2.2_t2v_*", "wan2.2-i2v-a14b*", "wan-ai/wan2.2-i2v-a14b"]
    code_license: Apache-2.0
    weights_license: apache-2.0
    commercial: "yes"
    source: https://huggingface.co/Wan-AI/Wan2.2-I2V-A14B
    checked: "2026-11-11"
  - id: wan-support-files
    kind: video
    match: ["umt5_xxl_*", "wan_2.1_vae*", "wan2.2_vae*", "clip_vision_h*"]
    code_license: Apache-2.0
    weights_license: apache-2.0
    commercial: "yes"
    note: Text encoder, VAE and CLIP vision files from Comfy-Org's repackaged Wan repositories (tagged apache-2.0).
    source: https://huggingface.co/Comfy-Org/Wan_2.1_ComfyUI_repackaged
    checked: "2026-11-11"
  - id: ltx-2
    kind: video
    match: ["ltx-2*", "ltx2*", "lightricks/ltx-2*"]
    code_license: Apache-2.0
    weights_license: LTX-2 Community License
    commercial: conditional
    conditions:
      - {type: revenue_cap, max_annual_revenue_usd: 10000000}
    note: A paid licence is needed at $10M annual revenue or more. The Gemma 3 text encoder stays under Google's terms.
    source: https://github.com/Lightricks/LTX-2/blob/main/LICENSE-2
    checked: "2026-11-11"
  - id: ltx-video-0.9
    kind: video
    match: ["ltx-video*", "ltxv-*", "ltxv_*", "lightricks/ltx-video*"]
    code_license: Apache-2.0
    weights_license: LTX-Video Open Weights License 0.X
    commercial: conditional
    conditions:
      - {type: revenue_cap, max_annual_revenue_usd: 10000000}
    note: Free unless annual revenue is $10M or more.
    source: https://huggingface.co/Lightricks/LTX-Video/blob/main/LTX-Video-Open-Weights-License-0.X.txt
    checked: "2026-11-11"
  - id: hunyuanvideo
    kind: video
    match: ["hunyuan_video*", "hunyuanvideo*", "hunyuan-video*", "tencent/hunyuanvideo*"]
    code_license: Tencent Hunyuan Community License
    weights_license: tencent-hunyuan-community
    commercial: conditional
    conditions:
      - {type: territory, excluded: [EU, UK, KR]}
    note: 'The licence "DOES NOT APPLY IN THE EUROPEAN UNION, UNITED KINGDOM AND SOUTH KOREA", and outputs may not be used or displayed outside the Territory.'
    source: https://github.com/Tencent-Hunyuan/HunyuanVideo-1.5/blob/master/LICENSE
    checked: "2026-11-11"
  - id: cogvideox-5b
    kind: video
    match: ["cogvideox*", "thudm/cogvideox*", "zai-org/cogvideox*"]
    code_license: Apache-2.0
    weights_license: CogVideoX License
    commercial: conditional
    conditions:
      - {type: registration, text: "commercial use needs registration, and is free only up to 1M monthly visits"}
    source: https://huggingface.co/THUDM/CogVideoX-5b-I2V/blob/main/LICENSE
    checked: "2026-11-11"

